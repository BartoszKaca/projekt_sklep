# Nginx Configuration for Rap Shop Laravel Application
# Production Environment - AWS EC2
# ======================================================

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name rapshop.pl www.rapshop.pl;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect wszystkich innych żądań do HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rapshop.pl www.rapshop.pl;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/rapshop.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rapshop.pl/privkey.pem;

    # SSL Configuration (Modern Best Practices)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS - Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Logging
    access_log /var/log/nginx/rapshop_access.log combined;
    error_log /var/log/nginx/rapshop_error.log warn;

    # Root directory
    root /var/www/html/public;
    index index.php index.html;

    # Timeout settings
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # ============================================================
    # MAIN APPLICATION - Laravel
    # ============================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Files - Forward to FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        include fastcgi_params;

        # Security
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;

        # Real IP for Cloudflare/Proxies
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;

        # Timeouts
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # ============================================================
    # PHPMYADMIN - Admin Panel
    # ============================================================
    location ~ ^/admin/phpmyadmin(?:/|$) {
        # IP Whitelist - Zmień na Twoje IP!
        allow 127.0.0.1;
        allow 10.0.0.0/8;          # AWS Private IPs
        allow YOUR_HOME_IP;         # ZMIEŃ TO!
        deny all;

        # Basic Auth (dodatkowe zabezpieczenie)
        auth_basic "PHPMyAdmin Access Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Proxy do kontenera PHPMyAdmin
        proxy_pass http://phpmyadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookies
        proxy_cookie_path / "/admin/phpmyadmin/";
    }

    # Alternatywnie: Subdomena admin.rapshop.pl
    # location / {
    #     proxy_pass http://phpmyadmin;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ============================================================
    # STATIC FILES CACHING
    # ============================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # DENY ACCESS
    # ============================================================
    # Hide Laravel directories
    location ~ /\. {
        deny all;
    }

    location ~ /(?:\.env|\.git|\.github|\.gitlab-ci\.yml|composer\.(json|lock)|webpack\.mix\.js)$ {
        deny all;
    }

    location ~ /storage/logs {
        deny all;
    }

    location ~ /bootstrap/cache {
        deny all;
    }

    # Deny access to config files
    location ~ /config/ {
        deny all;
    }

    # ============================================================
    # GZIP COMPRESSION
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
}

