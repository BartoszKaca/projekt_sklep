# =============================================================================
# Konfiguracja Nginx dla Sklep Laravel - ZEWNĘTRZNY NGINX (na hoście)
# =============================================================================
# Skopiuj ten plik do: /etc/nginx/sites-available/sklep
# Aktywuj: sudo ln -s /etc/nginx/sites-available/sklep /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bartoszkaca.online www.bartoszkaca.online;
    
    # Przekierowanie HTTP → HTTPS (odkomentuj po SSL)
    # return 301 https://$host$request_uri;

    root /srv/laravel-app/sklep/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logi
    access_log /var/log/nginx/sklep_access.log;
    error_log /var/log/nginx/sklep_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    # PHP-FPM przez Docker (port 9000)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouty
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Blokuj ukryte pliki
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache statycznych plików
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blokuj wrażliwe pliki
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}

