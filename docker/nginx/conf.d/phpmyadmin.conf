# Konfiguracja Nginx dla phpMyAdmin
# Dostęp: http://pma.twoja-domena.pl
# Ustaw server_name na konkretną domenę lub użyj wildcard: *.twoja-domena.pl pma.*

server {
    listen 80;
    listen [::]:80;
    # Zmień na swoją subdomenę, np: pma.twoja-domena.pl
    # Możesz też użyć wildcard: pma.* lub *.twoja-domena.pl
    server_name pma.*;
    
    # Logi
    access_log /var/log/nginx/pma_access.log;
    error_log /var/log/nginx/pma_error.log;
    
    # Proxy do phpMyAdmin
    # Uwaga: nazwa serwisu musi odpowiadać nazwie w docker-compose.prod.yml
    location / {
        proxy_pass http://sklep_phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouty
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

