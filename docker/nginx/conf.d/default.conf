server {
    listen 80;
    listen [::]:80;
    # Domyślny serwer (główna aplikacja + phpMyAdmin przez /pma)
    server_name _;
    
    # Redirect HTTP to HTTPS (odkomentuj po konfiguracji SSL)
    # return 301 https://$host$request_uri;
    
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Logi
    access_log /var/log/nginx/sklep_access.log;
    error_log /var/log/nginx/sklep_error.log;

    # phpMyAdmin - dostęp przez /pma (PRZED główną lokalizacją /)
    location = /pma {
        return 301 /pma/;
    }
    
    location /pma/ {
        # POPRAWKA: użyj nazwy serwisu z docker-compose zamiast IP
        proxy_pass http://phpmyadmin:80/;
        
        # Podstawowe nagłówki proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Nagłówki dla phpMyAdmin
        proxy_set_header X-Forwarded-Prefix /pma;
        
        # Timeouty
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Naprawa przekierowań - ważne: bez końcowego slasha w proxy_pass
        proxy_redirect off;
        
        # Naprawa cookies
        proxy_cookie_path / /pma/;
        
        # Naprawa ścieżek w odpowiedziach HTML/CSS/JS
        sub_filter_types text/html text/css text/javascript application/javascript application/json text/xml;
        sub_filter 'href="/' 'href="/pma/';
        sub_filter 'src="/' 'src="/pma/';
        sub_filter 'action="/' 'action="/pma/';
        sub_filter "url('/" "url('/pma/";
        sub_filter 'url("/' 'url("/pma/';
        sub_filter "url(/" "url(/pma/";
        sub_filter_once off;
        sub_filter_last_modified on;
        
        # Wyłącz kompresję dla sub_filter
        proxy_set_header Accept-Encoding "";
    }
    
    # Statyczne zasoby phpMyAdmin (CSS, JS, obrazki, fonty)
    location ~* ^/pma/(themes|js|templates|vendor|doc|libraries)/.*\.(css|js|gif|jpg|jpeg|png|ico|svg|woff|woff2|ttf|eot)$ {
        # POPRAWKA: użyj nazwy serwisu zamiast IP
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    # PHP-FPM dla aplikacji Laravel
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouty dla długich requestów
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Blokuj dostęp do ukrytych plików
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache statycznych plików aplikacji
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blokuj dostęp do wrażliwych plików
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}

