# Konfiguracja PHP dla produkcji
# ==============================================

; Memory
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Upload
post_max_size = 256M
upload_max_filesize = 256M

; Display
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-errors.log

; Date
date.timezone = "Europe/Warsaw"

; Session
session.gc_maxlifetime = 86400
session.gc_probability = 1
session.gc_divisor = 1000

; Default character set
default_charset = "UTF-8"

; SMTP dla mail() function (jako fallback)
SMTP = smtp.mailtrap.io
smtp_port = 2525

; Disable dangerous functions
disable_functions = "exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,phpinfo"

; Security headers
expose_php = Off

; Real IP dla proxy (Nginx za nim)
; Nginx będzie ustawiać X-Real-IP i X-Forwarded-For
