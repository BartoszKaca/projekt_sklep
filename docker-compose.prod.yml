version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: sklep_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sklep_network
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  nginx:
    image: nginx:alpine
    container_name: sklep_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - sklep_network

  db:
    image: mysql:8.0
    container_name: sklep_db
    restart: unless-stopped
    command: >
      --lower_case_table_names=2
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-sklep_laravel}
      MYSQL_USER: ${DB_USERNAME:-sklep_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sklepsecret}
    ports:
      - "3306:3306"
    volumes:
      - sklep_mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - sklep_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Opcjonalnie: Redis dla cache i sesji
  redis:
    image: redis:alpine
    container_name: sklep_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - sklep_redis_data:/data
    networks:
      - sklep_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Queue worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: sklep_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sklep_network
    environment:
      - APP_ENV=production

  # Scheduler (cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: sklep_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sklep_network
    environment:
      - APP_ENV=production

volumes:
  sklep_mysql_data:
    driver: local
  sklep_redis_data:
    driver: local

networks:
  sklep_network:
    driver: bridge

